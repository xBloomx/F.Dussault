<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1f26">
    <title>Connexion — F.Dussault</title>
    <link rel="icon" href="/assets/logo_app.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1f26;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .login-logo {
            width: 180px;
            object-fit: contain;
        }

        .login-container {
            width: 100%;
            background: #2a2b35;
            border-radius: 12px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-container h2 {
            text-align: center;
            font-size: 20px;
            color: #fcca46;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            background: #1e1f26;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #fcca46;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-pwd {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-pwd svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #fcca46;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .login-btn:hover { background: #e5b63b; }

        .login-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        #error-message {
            display: none;
            background: rgba(220,53,69,0.15);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <img src="/assets/logo+nom.png" alt="F.Dussault" class="login-logo" onerror="this.style.display='none'">

    <form class="login-container" onsubmit="event.preventDefault(); seConnecter();">
        <h2>Connexion</h2>

        <div class="input-group">
            <label for="email">Adresse courriel</label>
            <input type="email" id="email" placeholder="exemple@email.com" autocomplete="email" required>
        </div>

        <div class="input-group">
            <label for="password">Mot de passe</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword()" aria-label="Afficher/masquer le mot de passe">
                    <svg id="eye-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="error-message"></div>

        <button type="submit" class="login-btn">Se connecter</button>
    </form>
</div>

<script type="module">
    import { supabase } from '/src/supabase.js'

    // Si déjà connecté, aller directement à l'app
    const { data: { session: existingSession } } = await supabase.auth.getSession()
    if (existingSession) { window.location.replace('/'); }

    const MAX_ATTEMPTS = 3
    const LOCKOUT_MS = 30000
    let lockoutTimer = null

    function getAttempts() {
        return parseInt(sessionStorage.getItem('fd_login_attempts') || '0', 10)
    }

    function getLockoutUntil() {
        return parseInt(sessionStorage.getItem('fd_login_lockout_until') || '0', 10)
    }

    function applyLockout(btn, errorEl) {
        sessionStorage.setItem('fd_login_lockout_until', Date.now() + LOCKOUT_MS)
        btn.disabled = true
        function tick() {
            const remaining = Math.ceil((getLockoutUntil() - Date.now()) / 1000)
            if (remaining <= 0) {
                btn.disabled = false
                btn.textContent = 'Se connecter'
                sessionStorage.removeItem('fd_login_attempts')
                sessionStorage.removeItem('fd_login_lockout_until')
                errorEl.style.display = 'none'
                return
            }
            btn.textContent = `Réessayer dans ${remaining}s`
            errorEl.textContent = `Trop de tentatives. Réessayez dans ${remaining} secondes.`
            errorEl.style.display = 'block'
            lockoutTimer = setTimeout(tick, 1000)
        }
        tick()
    }

    window.togglePassword = function() {
        const input = document.getElementById('password')
        const icon = document.getElementById('eye-icon')
        if (input.type === 'password') {
            input.type = 'text'
            icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.25 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>'
        } else {
            input.type = 'password'
            icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>'
        }
    }

    window.seConnecter = async function() {
        const btn = document.querySelector('.login-btn')
        const errorEl = document.getElementById('error-message')
        const email = document.getElementById('email').value
        const password = document.getElementById('password').value

        errorEl.style.display = 'none'
        if (getLockoutUntil() > Date.now()) return

        if (!email || !password) {
            errorEl.textContent = 'Veuillez remplir tous les champs.'
            errorEl.style.display = 'block'
            return
        }

        btn.disabled = true
        btn.textContent = 'Connexion…'

        const { error } = await supabase.auth.signInWithPassword({ email, password })

        if (error) {
            const attempts = getAttempts() + 1
            sessionStorage.setItem('fd_login_attempts', attempts)
            if (attempts >= MAX_ATTEMPTS) {
                applyLockout(btn, errorEl)
            } else {
                btn.disabled = false
                btn.textContent = 'Se connecter'
                const restantes = MAX_ATTEMPTS - attempts
                errorEl.textContent = `Courriel ou mot de passe incorrect. (${restantes} tentative${restantes > 1 ? 's' : ''} restante${restantes > 1 ? 's' : ''})`
                errorEl.style.display = 'block'
            }
        } else {
            sessionStorage.removeItem('fd_login_attempts')
            sessionStorage.removeItem('fd_login_lockout_until')
            window.location.href = '/'
        }
    }

    // Vérifier lockout au chargement
    if (getLockoutUntil() > Date.now()) {
        const btn = document.querySelector('.login-btn')
        const errorEl = document.getElementById('error-message')
        applyLockout(btn, errorEl)
    }
</script>

</body>
</html>
