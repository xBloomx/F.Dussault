<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Interface F.Dussault</title>

    <link rel="apple-touch-icon" href="/assets/logo_app.png">
    <link rel="icon" type="image/png" href="/assets/logo_app.png">
    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="F.Dussault">
    <meta name="theme-color" content="#1e1f26">

    <link rel="stylesheet" href="/src/shared/styles.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* Le fond couvre tout l'écran jusqu'au bord (home indicator inclus) */
        html { background-color: #1e1f26; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 0;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ─────────────────────────────────────────────── */
        .sidebar {
            width: 80px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* padding-top inclut la safe area pour que les icônes ne passent pas sous la notch */
            padding: calc(20px + env(safe-area-inset-top, 0px)) 0 20px;
            z-index: 1000;
            transition: left 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }
        .sidebar::-webkit-scrollbar { display: none; }
        .sidebar-top { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .sidebar-bottom { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; margin-top: auto; padding-top: 15px; }

        .nav-btn {
            position: relative;
            background: none; border: none; cursor: pointer;
            padding: 10px; border-radius: 10px;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .nav-btn:hover { background-color: rgba(255,255,255,0.3); }
        .nav-btn.active { background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-btn img, .nav-btn svg { width: 30px; height: 30px; object-fit: contain; display: block; transition: transform 0.2s ease; }
        .nav-btn:hover img, .nav-btn:hover svg { transform: scale(1.15); }
        .nav-btn svg { stroke: black; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        /* Badge messagerie */
        .notif-badge {
            position: absolute; top: 4px; right: 4px;
            background: #ff4d4d; color: white;
            font-size: 10px; font-weight: bold;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: none; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
            border: 2px solid var(--sidebar-bg);
        }
        .notif-badge.visible { display: flex; }

        /* ── MAIN CONTENT ─────────────────────────────────────────── */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            position: relative; background-color: var(--bg-dark);
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
        }
        /* En PWA standalone : réserve l'espace du home indicator en bas */
        @media (display-mode: standalone) {
            .main-content { padding-bottom: env(safe-area-inset-bottom, 0px); }
        }

        #app-loader {
            position: absolute; inset: 0;
            background: var(--bg-dark);
            z-index: 500;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.3s ease;
        }
        #app-loader.hidden { opacity: 0; pointer-events: none; }

        #app-container {
            flex: 1; height: 100%; overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }
        /* Wrapper créé dynamiquement par navigateTo — remplit #app-container via flex */
        .view-container {
            flex: 1; min-height: 0; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ─── Toast : géré par src/shared/styles.css (.shared-toast) ─── */

        /* Indicateur connexion */
        #conn-indicator {
            position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
            background: rgba(30,31,38,0.95); border: 1px solid #333;
            color: #28a745; font-size: 11px; padding: 4px 10px;
            border-radius: 20px; display: flex; align-items: center; gap: 5px;
            z-index: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        #conn-indicator.offline { color: #ff4d4d; }
        #conn-indicator.show { opacity: 1; }
        #conn-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

        /* Bannière hors ligne persistante */
        #offline-banner {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(192,57,43,0.97);
            color: white; padding: calc(7px + env(safe-area-inset-top, 0px)) 16px 7px;
            font-size: 13px; font-weight: 500;
            text-align: center; z-index: 9998;
            align-items: center; justify-content: center; gap: 8px;
        }
        #offline-banner.show { display: flex; }
        #offline-banner svg { flex-shrink: 0; }

        /* Menu hamburger mobile */
        .menu-btn {
            display: none;
            position: fixed;
            top: calc(25px + env(safe-area-inset-top, 0px));
            right: calc(25px + env(safe-area-inset-right, 0px));
            z-index: 1100;
            background-color: var(--accent);
            border: none; width: 48px; height: 48px;
            border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: opacity 0.15s ease, transform 0.15s ease;
            justify-content: center; align-items: center;
        }
        .menu-btn:active { transform: scale(0.90); }
        .menu-btn svg { width: 26px; height: 26px; stroke: black; stroke-width: 3; stroke-linecap: round; display: block; }
        .menu-btn.hide { opacity: 0; pointer-events: none; transform: scale(0.5); }

        #overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            display: none; z-index: 900;
            backdrop-filter: blur(2px);
        }
        #overlay.active { display: block; }

        /* Écran maintenance */
        #maintenance-screen {
            display: none;
            position: fixed; inset: 0;
            background-color: #1e1f26;
            z-index: 999999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        /* Mode signature plein écran */
        body.signature-mode-active .sidebar { display: none !important; }
        body.signature-mode-active .menu-btn { display: none !important; }

        /* Responsive */
        @media (min-width: 769px) and (max-width: 1024px) {
            .sidebar { position: relative; left: 0; width: 80px; flex-shrink: 0; }
            .menu-btn { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; bottom: 0; left: -100px;
                width: 100px;
                background: var(--sidebar-bg);
                transition: left 0.3s ease;
                z-index: 1000;
                box-shadow: 2px 0 10px rgba(0,0,0,0.5);
                padding-top: calc(20px + env(safe-area-inset-top, 0px));
                padding-bottom: 20px;
            }
            .sidebar.open { left: 0; }
            .menu-btn { display: flex; }
            .main-content { width: 100%; }
        }
    </style>
    <!-- emoji-picker-element pour la messagerie -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body>

<!-- Loader initial -->
<div id="security-loader" style="position:fixed;inset:0;background:#1e1f26;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.4s ease">
    <img src="/assets/logo+nom.png" alt="Logo F.Dussault" style="width:220px;height:auto;margin-bottom:25px;display:block">
    <svg width="200" height="3" viewBox="0 0 200 3">
        <rect width="200" height="3" fill="rgba(255,255,255,0.05)" rx="1.5"/>
        <rect width="70" height="3" fill="#fcca46" rx="1.5">
            <animate attributeName="x" values="-70; 200" dur="1.7s" repeatCount="indefinite"/>
        </rect>
    </svg>
</div>

<!-- Indicateur connexion -->
<div id="conn-indicator"><div id="conn-dot"></div><span id="conn-text">Connecté</span></div>

<!-- Écran maintenance -->
<div id="maintenance-screen">
    <svg style="width:100px;height:100px;color:#fcca46;stroke:currentColor;stroke-width:2;fill:none;margin-bottom:20px" viewBox="0 0 24 24">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h1 style="color:white;margin:0 0 10px;font-size:32px;font-weight:bold">Maintenance en cours</h1>
    <p style="color:#aaa;font-size:16px;max-width:400px;line-height:1.5;margin:0 auto">L'application F.Dussault est temporairement indisponible pour une mise à jour.</p>
    <p style="color:#666;font-size:13px;margin-top:30px">Veuillez réessayer plus tard.</p>
</div>

<!-- Hamburger -->
<button id="menu-toggle" class="menu-btn" title="Ouvrir le menu" aria-label="Menu">
    <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/></svg>
</button>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
        <button class="nav-btn active" data-view="accueil" title="Accueil" aria-label="Accueil">
            <img src="/assets/logo_accueil.png" alt="Accueil" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" data-view="facture" title="Factures" aria-label="Factures">
            <img src="/assets/logo_facture.png" alt="Factures" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn hidden" id="btn-nav-soumissions" data-view="soumissions" title="Soumissions" aria-label="Soumissions">
            <img src="/assets/logo_soumission.png" alt="Soumissions" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" data-view="feuilleTemps" title="Feuille de temps" aria-label="Feuille de temps">
            <img src="/assets/logo_feuille_de_temps.png" alt="Feuille de temps" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" id="btn-nav-messagerie" data-view="messagerie" title="Messagerie" aria-label="Messagerie">
            <img src="/assets/logo_messagerie.png" alt="Messagerie" onerror="this.style.display='none'">
            <span class="notif-badge" id="badge-messagerie">0</span>
        </button>
        <button class="nav-btn hidden" id="btn-nav-courriel" data-view="courriel" title="Boîte Courriel" aria-label="Boîte Courriel">
            <img src="/assets/logo_courriel.png" alt="Boîte Courriel" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" data-view="calendrier" title="Calendrier" aria-label="Calendrier">
            <img src="/assets/logo_calendrier.png" alt="Calendrier" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" data-view="clients" title="Clients" aria-label="Clients">
            <img src="/assets/logo_client.png" alt="Clients" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn" data-view="outils" title="Outils" aria-label="Outils">
            <img src="/assets/logo_outils.png" alt="Outils" onerror="this.style.display='none'">
        </button>
        <button class="nav-btn hidden" id="btn-nav-po" data-view="po" title="Bons de commande" aria-label="Bons de commande">
            <img src="/assets/logo_po.png" alt="Bons de commande" onerror="this.style.display='none'">
        </button>
    </div>
    <div class="sidebar-bottom">
        <button class="nav-btn hidden" id="btn-nav-admin" data-view="admin" title="Administration" aria-label="Administration">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button class="nav-btn" data-view="profil" title="Profil personnel" aria-label="Profil personnel">
            <img src="/assets/logo_profil.png" alt="Profil" onerror="this.style.display='none'">
        </button>
    </div>
</aside>

<!-- Contenu principal -->
<div class="main-content">
    <div id="app-loader">
        <svg width="200" height="3" viewBox="0 0 200 3">
            <rect width="200" height="3" fill="rgba(255,255,255,0.05)" rx="1.5"/>
            <rect width="70" height="3" fill="#fcca46" rx="1.5">
                <animate attributeName="x" values="-70; 200" dur="1.7s" repeatCount="indefinite"/>
            </rect>
        </svg>
    </div>
    <div id="app-container"></div>
</div>

<div id="overlay"></div>
<div id="toast-container"></div>

<!-- Bannière installation iOS -->
<div id="ios-install-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#23242f;border-top:1px solid #3a3b4a;padding:14px 16px 18px;z-index:9996;align-items:center;gap:14px;box-shadow:0 -4px 20px rgba(0,0,0,0.4)">
    <div style="width:40px;height:40px;background:#1e1f26;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <img src="/assets/logo_app.png" style="width:32px;height:32px;border-radius:7px;object-fit:contain" onerror="this.style.display='none'">
    </div>
    <div style="flex:1;min-width:0">
        <div style="color:white;font-weight:700;font-size:13px;margin-bottom:3px">Installer F.Dussault</div>
        <div style="color:#aaa;font-size:11.5px;line-height:1.4">Appuyez sur
            <svg viewBox="0 0 24 24" width="13" height="13" style="display:inline-block;vertical-align:middle;margin:0 1px;stroke:#fcca46;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            puis <strong style="color:white">« Sur l'écran d'accueil »</strong> pour une expérience plein écran.</div>
    </div>
    <button id="ios-install-close" style="background:none;border:none;color:#666;font-size:18px;cursor:pointer;padding:4px 6px;flex-shrink:0;line-height:1" aria-label="Fermer">✕</button>
</div>

<!-- Bannière hors ligne -->
<div id="offline-banner">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <span id="offline-text">Hors ligne — les modifications sont sauvegardées localement</span>
</div>

<script type="module">
import { installConsoleFilter } from '/src/shared/consoleFilter.js'
import { loadSession, watchSession, currentUser, currentRole, currentProfil, hasPermission, invalidateRolesCache, reloadRolesConfig } from '/src/auth.js'
import { supabase } from '/src/supabase.js'
import { hasPendingOfflineSaves, getPendingCount, flushOfflineQueue } from '/src/shared/offlineQueue.js'

installConsoleFilter()

// ── Modules lazy ────────────────────────────────────────────────────────────
const MODULE_MAP = {
    accueil:      () => import('/src/views/accueil.js'),
    facture:      () => import('/src/views/facture.js'),
    soumissions:  () => import('/src/views/soumissions.js'),
    feuilleTemps: () => import('/src/views/feuilleTemps.js'),
    messagerie:   () => import('/src/views/messagerie.js'),
    courriel:     () => import('/src/views/courriel.js'),
    calendrier:   () => import('/src/views/calendrier.js'),
    clients:      () => import('/src/views/clients.js'),
    outils:       () => import('/src/views/outils.js'),
    po:           () => import('/src/views/po.js'),
    admin:        () => import('/src/views/admin.js'),
    profil:       () => import('/src/views/profil.js'),
}

// ── État ────────────────────────────────────────────────────────────────────
let currentView = 'accueil'
let currentCleanup = null
const appContainer = document.getElementById('app-container')
const appLoader = document.getElementById('app-loader')
const mainLoader = document.getElementById('security-loader')
const sidebar = document.getElementById('sidebar')
const menuBtn = document.getElementById('menu-toggle')
const overlay = document.getElementById('overlay')

// ── Router ──────────────────────────────────────────────────────────────────
async function navigateTo(viewName) {
    if (!MODULE_MAP[viewName]) return

    if (currentCleanup) { try { currentCleanup() } catch {} currentCleanup = null }

    appLoader.classList.remove('hidden')
    appContainer.innerHTML = ''
    appContainer.style.opacity = '0'

    // Wrapper flex qui remplit #app-container — résout le bug de hauteur iOS Safari
    const el = document.createElement('div')
    el.className = 'view-container'
    appContainer.appendChild(el)

    try {
        const mod = await MODULE_MAP[viewName]()
        const cleanup = await mod.render(el)
        if (typeof cleanup === 'function') currentCleanup = cleanup
    } catch (e) {
        // Module introuvable = SW périmé après déploiement → recharger une seule fois
        if (e instanceof TypeError && e.message.includes('Failed to fetch dynamically imported module')) {
            if (!sessionStorage.getItem('sw_reload_attempted')) {
                sessionStorage.setItem('sw_reload_attempted', '1')
                window.location.reload()
                return
            }
        }
        sessionStorage.removeItem('sw_reload_attempted')
        console.error('[Router] Erreur chargement module', viewName, e)
        el.innerHTML = `<div style="color:#ff4d4d;padding:30px;text-align:center">Erreur de chargement du module.<br><small>${e.message}</small></div>`
    }

    currentView = viewName
    appLoader.classList.add('hidden')

    requestAnimationFrame(() => {
        appContainer.style.transition = 'opacity 0.18s ease'
        appContainer.style.opacity = '1'
    })
}

// ── Sidebar nav ─────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
        const view = btn.dataset.view

        // Badge messagerie
        if (view === 'messagerie') {
            const badge = document.getElementById('badge-messagerie')
            if (badge) { badge.textContent = '0'; badge.classList.remove('visible') }
        }

        // Highlight actif
        document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')

        // Fermer sidebar mobile
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open')
            overlay.classList.remove('active')
            menuBtn.classList.remove('hide')
        }

        navigateTo(view)
    })
})

// ── Menu hamburger ───────────────────────────────────────────────────────────
menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('active'); menuBtn.classList.add('hide') })
overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); menuBtn.classList.remove('hide') })

// ── Badge messagerie via événement DOM ──────────────────────────────────────
window.addEventListener('new_message_notif', () => {
    if (currentView !== 'messagerie') {
        const badge = document.getElementById('badge-messagerie')
        if (badge) { badge.textContent = (parseInt(badge.textContent) || 0) + 1; badge.classList.add('visible') }
    }
})

// ── Permissions sidebar ──────────────────────────────────────────────────────
function appliquerPermissions() {
    const btnAdmin = document.getElementById('btn-nav-admin')
    const btnPo = document.getElementById('btn-nav-po')
    const btnSoumissions = document.getElementById('btn-nav-soumissions')
    const btnCourriel = document.getElementById('btn-nav-courriel')
    if (btnAdmin) btnAdmin.classList.toggle('hidden', !hasPermission('view_admin'))
    if (btnPo) btnPo.classList.toggle('hidden', !hasPermission('access_po_tab'))
    if (btnSoumissions) btnSoumissions.classList.toggle('hidden', !hasPermission('access_soumissions_tab'))
    if (btnCourriel) btnCourriel.classList.toggle('hidden', !hasPermission('access_courriel_tab'))
}

// ── Permissions updated (admin) ──────────────────────────────────────────────
window.addEventListener('permissions_updated', async () => {
    // Invalider le cache des rôles et le recharger depuis la DB
    await reloadRolesConfig()
    appliquerPermissions()
})

// ── PWA shortcuts (?view=factures) ──────────────────────────────────────────
function handlePWAShortcut() {
    const v = new URLSearchParams(window.location.search).get('view')
    if (!v) return
    const map = {
        factures: 'facture', soumissions: 'soumissions', temps: 'feuilleTemps',
        feuilles: 'feuilleTemps', messagerie: 'messagerie', courriel: 'courriel',
        calendrier: 'calendrier', clients: 'clients', client: 'clients',
        po: 'po', outils: 'outils', admin: 'admin', profil: 'profil', parametres: 'profil'
    }
    const target = map[v.toLowerCase()]
    if (!target) return
    const btn = document.querySelector(`.nav-btn[data-view="${target}"]`)
    if (btn && !btn.classList.contains('hidden')) btn.click()
}

// ── Toast global ─────────────────────────────────────────────────────────────
window.showToast = function(msg, type = 'info', duration = 3000) {
    if (type !== 'error' && type !== 'warning' && type !== 'success') return
    const tc = document.getElementById('toast-container')
    const t = document.createElement('div')
    t.className = `shared-toast ${type}`
    t.textContent = msg
    tc.appendChild(t)
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')))
    setTimeout(() => {
        t.classList.remove('show')
        setTimeout(() => t.remove(), 300)
    }, duration)
}

// ── Toggle hamburger mobile depuis les modules (modales ouvertes/fermées) ────
// Reproduit le comportement postMessage({ type: 'toggle_menu' }) de l'ancienne version
window.addEventListener('toggle_menu', (e) => {
    if (window.innerWidth > 768) return  // desktop : hamburger n'existe pas
    if (e.detail?.action === 'hide') {
        menuBtn.style.display = 'none'
    } else {
        menuBtn.style.display = ''
    }
})

// MutationObserver : cache/montre automatiquement le hamburger quand une modale
// plein-écran s'ouvre/ferme dans un module (classe .open sur .modal-overlay)
const _modalObserver = new MutationObserver(() => {
    if (window.innerWidth > 768) return
    const hasOpenModal = document.querySelector(
        '.modal-overlay.open, .custom-modal-overlay.open, #sig-fd-modal.show'
    )
    menuBtn.style.display = hasOpenModal ? 'none' : ''
})
_modalObserver.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] })

// ── Connexion online/offline ─────────────────────────────────────────────────
const connIndicator = document.getElementById('conn-indicator')
const connText = document.getElementById('conn-text')
const offlineBanner = document.getElementById('offline-banner')
const offlineText = document.getElementById('offline-text')
let connTimer = null

function showConnStatus(online) {
    if (connTimer) clearTimeout(connTimer)
    connIndicator.className = online ? 'show' : 'offline show'
    connText.textContent = online ? 'Reconnecté' : 'Hors ligne'
    if (online) {
        offlineBanner?.classList.remove('show')
        connTimer = setTimeout(() => connIndicator.classList.remove('show'), 2000)
    } else {
        offlineBanner?.classList.add('show')
    }
}

window.addEventListener('online', async () => {
    if (!hasPendingOfflineSaves()) { showConnStatus(true); return }
    const n = getPendingCount()
    if (offlineText) offlineText.textContent = `Reconnecté — synchronisation de ${n} document(s)...`
    const { flushed, failed } = await flushOfflineQueue(
        async (table, payload) => supabase.from(table).upsert(payload)
    )
    showConnStatus(true)
    if (flushed > 0) window.showToast(`${flushed} document(s) synchronisé(s) avec succès.`, 'success', 4000)
    if (failed > 0) window.showToast(`${failed} synchronisation(s) échouée(s). Ouvrez et sauvegardez manuellement.`, 'error', 6000)
    if (offlineText) offlineText.textContent = 'Hors ligne — les modifications sont sauvegardées localement'
})

window.addEventListener('offline', () => showConnStatus(false))

// ── Mode maintenance live (admin toggle → tous les users connectés) ───────────
window.addEventListener('toggle_maintenance', (e) => {
    const active = e.detail?.active
    const maintenanceScreen = document.getElementById('maintenance-screen')
    if (!maintenanceScreen) return
    if (active) {
        // A0 n'est jamais bloqué par la maintenance
        if (currentRole === 'A0') return
        maintenanceScreen.style.display = 'flex'
        menuBtn.style.display = 'none'
    } else {
        maintenanceScreen.style.display = 'none'
        if (window.innerWidth <= 768) menuBtn.style.display = 'flex'
    }
})

// ── Cascade formations (Profil → Accueil + Calendrier rechargent) ─────────────
window.addEventListener('formations_updated', () => {
    // Si l'accueil ou le calendrier est actuellement affiché, forcer un rechargement
    const view = currentView
    if (view === 'accueil' || view === 'calendrier') {
        navigateTo(view)
    }
})

// ── Mode signature plein écran (modules → index.html) ─────────────────────────
window.addEventListener('signature_mode', (e) => {
    const action = e.detail?.action
    if (action === 'enter') {
        document.body.classList.add('signature-mode-active')
        menuBtn.classList.add('hide')
    } else {
        document.body.classList.remove('signature-mode-active')
        menuBtn.classList.remove('hide')
    }
})

// ── Init ──────────────────────────────────────────────────────────────────────
async function boot() {
    try {
        // Vérifier la session SANS appeler getUser() qui peut causer des locks
        const { data: { session } } = await supabase.auth.getSession()
        if (!session) {
            window.location.replace('/login.html')
            return
        }

        const user = await loadSession()
        if (!user) {
            window.location.replace('/login.html')
            return
        }

        // Vérifier maintenance
        if (currentRole !== 'A0') {
            const { data: param } = await supabase.from('parametres_globaux').select('valeur').eq('cle', 'mode_maintenance').maybeSingle()
            if (param?.valeur === 'true') {
                document.getElementById('maintenance-screen').style.display = 'flex'
                menuBtn.style.display = 'none'
                mainLoader.style.opacity = '0'
                setTimeout(() => mainLoader.style.display = 'none', 400)
                return
            }
        }

        appliquerPermissions()

        // Surveiller l'expiration de session — redirige vers login si SIGNED_OUT
        watchSession(() => { window.location.replace('/login.html') })

        if (!navigator.onLine) showConnStatus(false)

        mainLoader.style.opacity = '0'
        setTimeout(() => mainLoader.style.display = 'none', 400)

        handlePWAShortcut()
        if (currentView === 'accueil') await navigateTo('accueil')

    } catch (e) {
        console.warn('[Boot] Erreur critique:', e?.message)
        // NE PAS rediriger ici — évite la boucle infinie
    }
}

boot()

// ── Bannière installation iOS ─────────────────────────────────────────────────
;(() => {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
    const isStandalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches
    const dismissed = localStorage.getItem('ios_install_dismissed')
    if (!isIOS || isStandalone || dismissed) return

    const banner = document.getElementById('ios-install-banner')
    if (!banner) return
    // Afficher après 3s pour laisser l'app charger
    setTimeout(() => { banner.style.display = 'flex' }, 3000)

    document.getElementById('ios-install-close').addEventListener('click', () => {
        banner.style.display = 'none'
        localStorage.setItem('ios_install_dismissed', '1')
    })
})()

// Nouveau service worker activé → recharger pour utiliser les nouveaux assets
if ('serviceWorker' in navigator) {
    let swInitialized = false
    navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!swInitialized) { swInitialized = true; return } // ignorer l'activation initiale
        window.location.reload()
    })
    navigator.serviceWorker.ready.then(() => { swInitialized = true })
}
</script>
