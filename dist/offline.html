<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hors ligne — F.Dussault</title>
    <link rel="icon" href="/assets/logo_app.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1f26;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 30px;
        }
        img { width: 160px; height: auto; margin-bottom: 30px; display: block; }
        svg { width: 64px; height: 64px; color: #fcca46; stroke: currentColor; stroke-width: 1.5; fill: none; margin-bottom: 20px; }
        h1 { font-size: 28px; color: white; margin-bottom: 12px; }
        p { font-size: 15px; color: #aaa; max-width: 380px; line-height: 1.6; }
        button {
            margin-top: 30px;
            background: #fcca46;
            color: black;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <img src="/assets/logo+nom.png" alt="F.Dussault" onerror="this.style.display='none'">
    <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <h1>Vous êtes hors ligne</h1>
    <p>L'application F.Dussault nécessite une connexion internet pour fonctionner. Vérifiez votre connexion et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
