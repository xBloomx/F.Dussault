<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1f26">
    <title>Connexion — F.Dussault</title>
    <link rel="icon" href="/assets/logo_app.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1f26;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .login-logo {
            width: 180px;
            object-fit: contain;
        }

        .login-container {
            width: 100%;
            background: #2a2b35;
            border-radius: 12px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-container h2 {
            text-align: center;
            font-size: 20px;
            color: #fcca46;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            background: #1e1f26;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #fcca46;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-pwd {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-pwd svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #fcca46;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .login-btn:hover { background: #e5b63b; }

        .login-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        #error-message {
            display: none;
            background: rgba(220,53,69,0.15);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
    </style>
  <script type="module" crossorigin src="/assets/login-B93bTzFd.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Cf3xff8G.js">
  <link rel="modulepreload" crossorigin href="/assets/dist-DIBucx4m.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-BHP_DPH_.js">
<script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
<body>

<div class="login-wrapper">
    <img src="/assets/logo+nom.png" alt="F.Dussault" class="login-logo" onerror="this.style.display='none'">

    <form class="login-container" onsubmit="event.preventDefault(); seConnecter();">
        <h2>Connexion</h2>

        <div class="input-group">
            <label for="email">Adresse courriel</label>
            <input type="email" id="email" placeholder="exemple@email.com" autocomplete="email" required>
        </div>

        <div class="input-group">
            <label for="password">Mot de passe</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword()" aria-label="Afficher/masquer le mot de passe">
                    <svg id="eye-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="error-message"></div>

        <button type="submit" class="login-btn">Se connecter</button>
    </form>
</div>


</body>
</html>
